name: v9 reproducibility checks
on:
  push:
    branches: [main, tkde, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/restore_v9_artifacts.py
      - run: python -m compileall -q src scripts tests
      - run: python -m pytest -q
      - name: Check shell syntax
        run: find scripts -type f \( -name '*.sh' -o -name '*.slurm' \) -exec bash -n {} \;
      - run: python scripts/build_frozen_telemetry_stream.py
      - name: Offline CPU smoke test
        run: python scripts/run_frozen_telemetry_stream.py --methods levenshtein regex schema_registry --hardware-profile cpu --limit 100 --output-dir data/reports/ci-smoke
